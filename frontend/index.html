<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiTask Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <div class="nav-logo">W</div>
    <div class="nav-title">WikiTask Pro</div>
  </div>
  <div class="nav-user" id="navUser"></div>
</nav>

<div class="screen active" id="onboard">
  <h1>Your Wikipedia,<br>Curated</h1>
  <p class="sub">Enter your Wikipedia username to get started.</p>
  <div class="form-row">
    <input id="userInput" placeholder="Wikipedia username" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn btn-red" id="goBtn">Go</button>
  </div>
  <div class="err-msg" id="errMsg"></div>
</div>

<div class="screen" id="loading">
  <div class="spinner"></div>
  <div class="load-status" id="loadStatus">Starting…</div>
  <div class="load-sub" id="loadSub"></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
  <div class="stages">
    <div class="stg" id="s1"><span class="stg-dot"></span>Fetch edit history</div>
    <div class="stg" id="s2"><span class="stg-dot"></span>Build profile</div>
    <div class="stg" id="s3"><span class="stg-dot"></span>Scan news &amp; trends</div>
    <div class="stg" id="s4"><span class="stg-dot"></span>Find gaps</div>
    <div class="stg" id="s5"><span class="stg-dot"></span>Find quick wins</div>
    <div class="stg" id="s6"><span class="stg-dot"></span>Score &amp; rank</div>
  </div>
</div>

<div class="screen" id="dash">
  <div id="profileCard"></div>
</div>

<script src="js/api.js"></script>
<script src="js/profile-view.js"></script>
</body>
</html>
